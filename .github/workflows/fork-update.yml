name: Auto Update Debezium Fork

on:
  # schedule:
  #   - cron: '0 0 * * 0'
  push:
    branches: 
    - "PLT-831"
  workflow_dispatch:

jobs:
  update-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Auto Update Bot"
          git config user.email "bot@getbridge.com"
      
      - name: Get Latest Stable Tag
        id: get_tag
        run: |
          git remote add upstream https://github.com/debezium/debezium-server.git
          git fetch --tags upstream --prune

          UPSTREAM_FINAL_TAGS=$(git tag --list 'upstream/*' | grep 'upstream/v.*\.Final$')
          if [[ -z "$UPSTREAM_FINAL_TAGS" ]]; then
            echo "No stable tags found in upstream matching the pattern 'v*.Final'."
            exit 0
          fi

          LATEST_TAG=$(echo "$UPSTREAM_FINAL_TAGS" | sort -Vr | head -n 1 | sed 's^upstream/^^')

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
      
